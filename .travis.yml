language: go
os: linux
dist: jammy

go:
  - 1.25.x

if: (type = push AND branch = main) OR type = pull_request

cache:
  directories:
    - $HOME/go/pkg/mod
    - $HOME/.cache/go-build

install: true

script:
  - |
    unformatted=$(gofmt -l .)
    if [ -n "$unformatted" ]; then
      echo "These files are not gofmt-clean:"
      echo "$unformatted"
      exit 1
    fi
  - go vet ./...
  - go build ./cmd/...
  - go test -race ./...
  # The only end-to-end proof that a backup is actually restorable. It broke
  # unnoticed once already because nothing ran it.
  - ./scripts/restore-drill.sh
