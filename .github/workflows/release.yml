name: release

# Build every shipped binary (aqt client + git-remote-aqt helper + aqt-server) for
# every platform and attach them to a GitHub Release. Pure Go with CGO off, so one
# Linux runner cross-compiles all targets. Push a version tag to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# A manual run (workflow_dispatch) builds the same set and uploads them as
# workflow artifacts without creating a release, signing anything, or attesting.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# Least privilege by default; the publishing job widens this for itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    name: native test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # `go test ./...` covers internal/update, so the check-only update path is
      # exercised natively on Linux, macOS, and Windows. Its fixtures are local:
      # nothing here contacts GitHub or a live release.
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  build:
    name: build
    runs-on: ubuntu-latest
    needs: native-test
    permissions:
      contents: read
      actions: read   # let the SBOM action read its generated artifact metadata
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags + history so `git describe` works on manual runs

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries for all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # Only a tagged build is a release. `aqt update` refuses to treat anything
          # else as updatable, so a manual build can never present itself as one.
          if [ "$GITHUB_REF_TYPE" = tag ]; then kind=release; else kind=dev; fi
          ldflags="-s -w -X main.version=$VERSION -X main.buildKind=$kind"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            stage="stage/${GOOS}_${GOARCH}"; mkdir -p "$stage"
            echo "::group::build $GOOS/$GOARCH"
            for cmd in aqt git-remote-aqt aqt-server; do
              GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$ldflags" \
                -o "$stage/$cmd$ext" "./cmd/$cmd"
            done
            echo "::endgroup::"
            # One archive per binary so client, Git helper, and server can be grabbed
            # separately. The helper gets its own archive rather than riding inside the
            # client's: the updater refuses a release archive holding any entry other
            # than the `aqt` executable itself.
            for cmd in aqt git-remote-aqt aqt-server; do
              base="${cmd}_${VERSION}_${GOOS}_${GOARCH}"
              if [ "$GOOS" = windows ]; then
                (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$base.zip" "$cmd$ext")
              else
                tar -czf "dist/$base.tar.gz" -C "$stage" "$cmd$ext"
              fi
            done
          done
          ls -l dist

      # The manifest describes the archives that were just built: it reads their
      # real sizes and hashes and fails if any published platform is missing. It
      # needs no key, so it stays out of the protected signing job. The asset URLs
      # are deterministic, so they can be written before the release exists. The
      # repository comes from the same constant the client pins against, so the two
      # cannot drift.
      - name: Generate update manifest
        if: github.ref_type == 'tag'
        run: |
          go run ./cmd/updatectl gen \
            --dist dist \
            --version "${{ steps.version.outputs.version }}" \
            --out "dist/aqt-update.json"

      # Keep an SPDX inventory beside the archives and bind it to them below. This
      # runs over the source tree (including go.mod/go.sum), which is the common
      # dependency set for every cross-compiled archive.
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/aqt_${{ steps.version.outputs.version }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aqt-binaries-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: sign and publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build
    # The release-signing environment holds AQT_UPDATE_SIGNING_KEYS and is the only
    # place the release-signing private key is readable. Custody, rotation, and
    # compromise recovery are documented in docs/updates.md.
    environment: release-signing
    permissions:
      contents: write      # create the Release and upload its assets
      actions: read
      id-token: write      # mint the short-lived Sigstore certificate for attestations
      attestations: write  # publish provenance and SBOM attestations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: aqt-binaries-${{ needs.build.outputs.version }}
          path: dist

      - name: Sign the update manifest
        env:
          AQT_UPDATE_SIGNING_KEYS: ${{ secrets.AQT_UPDATE_SIGNING_KEYS }}
        run: |
          go run ./cmd/updatectl sign \
            --in "dist/aqt-update.json" \
            --out "dist/aqt-update.json.sig"

      # Verify against the keys compiled into this build, not the ones just used to
      # sign, and re-apply the client's URL pinning: this is the check that a shipped
      # client will accept the release. It fails until a production key is
      # provisioned and added to trustroots.go.
      - name: Verify the signature a client would see
        run: |
          go run ./cmd/updatectl verify \
            --in "dist/aqt-update.json" \
            --sig "dist/aqt-update.json.sig"

      # Checksums are computed after signing so the manifest, its signature, and the
      # SBOM are all covered by the attestations below.
      - name: Checksum every published file
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt

      # Sigstore-signed SLSA provenance lets a release consumer verify that every
      # published file came from this repository's release workflow.
      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      # Attach the SPDX document to the same subjects. Consumers can verify it with
      # `gh attestation verify ... --predicate-type https://spdx.dev/Document/v2.3`.
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
          sbom-path: dist/aqt_${{ needs.build.outputs.version }}_sbom.spdx.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          # Prefer notes for this tag, but allow the prepared Unreleased section
          # so creating the next release cannot fail solely because it was not
          # renamed before tagging.
          awk -v release="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" release "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 0 }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            awk '
              /^## \[Unreleased\]/ { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$notes"
          fi
          test -s "$notes" || { echo "no release notes found for $GITHUB_REF_NAME or Unreleased" >&2; exit 1; }
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          # LICENSE rides beside the archives rather than inside them: AGPL-3.0
          # requires the license text to accompany the binaries, and the updater
          # refuses any release archive holding an entry other than the executable.
          gh release create "$GITHUB_REF_NAME" dist/* LICENSE \
            --title "$GITHUB_REF_NAME" --notes-file "$notes" --generate-notes $prerelease
