name: release

# Build both binaries (aqt client + aqt-server) for every platform and attach
# them to a GitHub Release. Pure Go with CGO off, so one Linux runner
# cross-compiles all targets. Push a version tag to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# A manual run (workflow_dispatch) builds the same set and uploads them as
# workflow artifacts without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write   # create the Release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    name: native test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  build:
    name: build and release
    runs-on: ubuntu-latest
    needs: native-test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags + history so `git describe` works on manual runs

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries for all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ldflags="-s -w -X main.version=$VERSION"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            stage="stage/${GOOS}_${GOARCH}"; mkdir -p "$stage"
            echo "::group::build $GOOS/$GOARCH"
            for cmd in aqt aqt-server; do
              GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$ldflags" \
                -o "$stage/$cmd$ext" "./cmd/$cmd"
            done
            echo "::endgroup::"
            # One archive per binary so client and server can be grabbed separately.
            for cmd in aqt aqt-server; do
              base="${cmd}_${VERSION}_${GOOS}_${GOARCH}"
              if [ "$GOOS" = windows ]; then
                (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$base.zip" "$cmd$ext")
              else
                tar -czf "dist/$base.tar.gz" -C "$stage" "$cmd$ext"
              fi
            done
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqt-binaries-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease
