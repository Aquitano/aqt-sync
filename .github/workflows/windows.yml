name: windows

# Pull requests only. The push-to-main run was a re-test of a tree that had
# already passed this same job on its PR, and windows-latest is slow enough that
# it kept failing there on runner speed alone. Release tags still get a native
# Windows run from the release workflow's native-test matrix.
on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: native test
    runs-on: windows-latest
    # A hung job would otherwise run to the 6h default, billed at the 2x Windows rate.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Output "These files are not gofmt-clean:"
            $unformatted
            exit 1
          }
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/...
      # cmd/aqt runs ~200s here on a healthy runner and has hit 600s on a slow one,
      # so go test's 10m per-package default leaves no headroom. timeout-minutes
      # above still catches a real hang.
      - name: Test
        run: go test -timeout 20m ./...
